<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f0f2f5; }
        .main-table { width: 900px; background-color: #ffffff; border-collapse: collapse; }
        .header { background-color: #003580; color: white; text-align: center; height: 100px; }
        .nav { background-color: #004cb8; text-align: center; }
        .nav a { color: white; text-decoration: none; padding: 15px 20px; display: inline-block; }
        .content { padding: 40px; }
        .form-table { width: 500px; margin: 0 auto; }
        input[type="text"], textarea { width: 100%; padding: 8px; }
        .footer { background-color: #333; color: white; text-align: center; padding: 10px; }
    </style>
</head>
<body>

<table border="0" align="center" cellpadding="0" cellspacing="0" class="main-table">
    <tr><td class="header"><h1>GLOBAL WANDERER</h1></td></tr>
    <tr>
        <td class="nav">
            <a href="index.html">Home</a>
            <a href="places.html">Places to Visit</a>
            <a href="contact.html">Contact Us</a>
        </td>
    </tr>
    <tr>
        <td class="content">
            <h2 align="center">Get In Touch</h2>
            <form>
                <table class="form-table" cellpadding="10">
                    <tr>
                        <td>Name:</td>
                        <td><input type="text" name="name"></td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="text" name="email"></td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td><textarea rows="5"></textarea></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="submit" value="Send Inquiry"></td>
                    </tr>
                </table>
            </form>
        </td>
    </tr>
    <tr><td class="footer">&copy; 2026 Global Wanderer Travel Agency.</td></tr>
</table>
